services:
  mysql:
    image: mysql:8.4
    container_name: carhub-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: carhub
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: carhub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:Y2FyaHViLWRldi1rZXktMzItYnl0ZXMtbG9uZy0xMjM=}
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: carhub
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      FILESYSTEM_DISK: public
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/storage/app/public

volumes:
  mysql_data:
  storage_data:
