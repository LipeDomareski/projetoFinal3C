services:
  mysql:
    image: mysql:8.4
    container_name: carhub-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: carhub
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: carhub-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      APP_NAME: CarHub
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:ZogqCR3STTKinipjoW+JhLeIY73X+X8V6IVBZAkySxs=
      APP_URL: http://localhost:8000/

      FRONTEND_URL: http://localhost:5173/

      LOG_CHANNEL: stack
      LOG_LEVEL: debug

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: carhub
      DB_USERNAME: laravel
      DB_PASSWORD: laravel

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - storage_data:/var/www/storage/app/public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: carhub-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000/api

    depends_on:
      - backend

volumes:
  mysql_data:
  storage_data: